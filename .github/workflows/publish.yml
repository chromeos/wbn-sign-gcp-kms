name: Publish to npm via OSS Exit Gate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "Optional npm dist-tag (defaults to 'latest' when empty)"
        required: false
        type: string
        default: ""

permissions: {}

# Serialize releases targeting the same ref without cancelling an in-flight run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies, build, lint, and test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx prettier --check src/ tests/ bin/ README.md --ignore-unknown --config ./package.json
          npm test

      - name: Read and validate package metadata
        id: pkg
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PKG_NAME="$(jq -er '.name' package.json)"
          PKG_VERSION="$(jq -er '.version' package.json)"
          if [ -z "${PKG_NAME}" ] || [ -z "${PKG_VERSION}" ]; then
            echo "::error::Failed to read name/version from package.json"
            exit 1
          fi
          if [ "${EVENT_NAME}" = "release" ] && [ -n "${RELEASE_TAG}" ]; then
            tag_ver="${RELEASE_TAG#v}"
            if [ "${tag_ver}" != "${PKG_VERSION}" ]; then
              echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${PKG_VERSION}'"
              exit 1
            fi
          fi
          echo "name=${PKG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Pack tarball before cloud authentication
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/npm-pack"
          rm -rf "${pack_dir}"
          mkdir -p "${pack_dir}"
          npm pack --pack-destination "${pack_dir}" >/dev/null
          shopt -s nullglob
          tarballs=("${pack_dir}"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 packed tarball in ${pack_dir}, found ${#tarballs[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          tar_entries="$(tar -tzf "${tarball}")"
          if printf '%s\n' "${tar_entries}" | grep -Eq '(^|/)(gha-creds-[^/]*\.json|\.npmrc|manifest\.json)$'; then
            echo "::error::Refusing to publish tarball containing credentials or manifest metadata: ${tarball}"
            printf '%s\n' "${tar_entries}"
            exit 1
          fi
          echo "Packed clean tarball: ${tarball}"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up incomplete staged version (if any)
        shell: bash
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          existing="$(gcloud artifacts versions list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="wbn-sign-gcp-kms--npm" \
            --package="${PKG_NAME}" \
            --format="value(name)" 2>/dev/null | awk -F/ '{print $NF}' | grep -Fx "${PKG_VERSION}" || true)"
          if [ -n "${existing}" ]; then
            echo "Deleting previous staged version ${PKG_NAME}@${PKG_VERSION} before re-upload..."
            gcloud artifacts versions delete "${PKG_VERSION}" \
              --package="${PKG_NAME}" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="wbn-sign-gcp-kms--npm" \
              --delete-tags \
              --quiet
          fi

      - name: Stage package to Artifact Registry and submit OSS Exit Gate manifest
        shell: bash
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::${ACCESS_TOKEN}"

          npmrc_path="${RUNNER_TEMP}/exit-gate.npmrc"
          trap 'rm -f "${npmrc_path}" "${RUNNER_TEMP}/manifest.json" "${TARBALL}"' EXIT
          umask 077
          cat > "${npmrc_path}" <<NPMRC
          registry=https://us-npm.pkg.dev/oss-exit-gate-prod/wbn-sign-gcp-kms--npm/
          //us-npm.pkg.dev/oss-exit-gate-prod/wbn-sign-gcp-kms--npm/:always-auth=true
          //us-npm.pkg.dev/oss-exit-gate-prod/wbn-sign-gcp-kms--npm/:_authToken=${ACCESS_TOKEN}
          NPMRC

          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Packed tarball not found: ${TARBALL}"
            exit 1
          fi
          NPM_CONFIG_USERCONFIG="${npmrc_path}" npm publish "${TARBALL}" \
            --access public \
            --registry="https://us-npm.pkg.dev/oss-exit-gate-prod/wbn-sign-gcp-kms--npm/"

          manifest_path="${RUNNER_TEMP}/manifest.json"
          if [ -n "${DIST_TAG}" ]; then
            jq -n \
              --arg name "${PKG_NAME}" \
              --arg ver "${PKG_VERSION}" \
              --arg tag "${DIST_TAG}" \
              '{
                publish_all: false,
                publishing_groups: [
                  {
                    packages: [{ name: $name, version: $ver }]
                  }
                ],
                registry_config: {
                  npm: {
                    tags: [$tag]
                  }
                }
              }' > "${manifest_path}"
          else
            jq -n \
              --arg name "${PKG_NAME}" \
              --arg ver "${PKG_VERSION}" \
              '{
                publish_all: false,
                publishing_groups: [
                  {
                    packages: [{ name: $name, version: $ver }]
                  }
                ]
              }' > "${manifest_path}"
          fi

          manifest_uri="gs://oss-exit-gate-prod-projects-bucket/wbn-sign-gcp-kms/npm/manifests/manifest-${PKG_VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"
          gcloud storage cp --if-generation-match=0 "${manifest_path}" "${manifest_uri}"

          {
            echo "### OSS Exit Gate Submission — Pending Gate Publication"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | \`SUBMITTED (PENDING EXIT GATE)\` |"
            echo "| Package | \`${PKG_NAME}@${PKG_VERSION}\` |"
            echo "| Dist-tag | \`${DIST_TAG:-latest}\` |"
            echo "| Manifest GCS URI | \`${manifest_uri}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
